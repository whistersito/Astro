<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#000000">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%96%A4%3C/text%3E%3C/svg%3E">
<title>III</title>
<style>
  :root { --bg:#000; --fg:#cfcfcf; --dim:#6b6b6b; --red:#8a0000; }
  html, body { margin:0; background:var(--bg); color:var(--fg); }
  body { font-family:"Times New Roman", Times, serif; font-size:19px; line-height:1.7;
         max-width:34rem; margin:0 auto; padding:10vh 1.4rem 14vh; box-sizing:border-box; overflow-x:hidden; }
  button { all:unset; cursor:pointer; }
  .fade { opacity:0; animation:show 3s forwards; }
  @keyframes show { to { opacity:1; } }
  h1 { font-size:1.6rem; font-weight:normal; margin:0 0 .6rem; animation-delay:.4s; }
  #cap { color:var(--dim); font-style:italic; min-height:1.7em; margin:0 0 2.4rem; transition:opacity 1.5s; }
  .dim { color:var(--dim); font-style:italic; }
  .red { color:var(--red); min-height:1.7em; margin:.4rem 0 0; }

  /* the sentence, locked */
  #line { font-size:1.9rem; line-height:1.5; border-left:1px solid #2a2a2a; padding-left:1rem; margin-bottom:2rem; }
  #cur { display:inline-block; width:12px; height:1.8rem; vertical-align:-.35rem; margin-left:2px; position:relative; }
  #cur::before { content:""; position:absolute; left:4px; top:0; width:2px; height:100%; background:var(--fg); animation:blink 1.1s steps(1) infinite; }
  @keyframes blink { 50% { opacity:0; } }
  #rest { opacity:0; transition:opacity 3s; } #rest.on { opacity:1; }
  body.solved #cur::before { display:none; }
  #inp { position:absolute; opacity:0; width:1px; height:1px; border:0; padding:0; }

  /* the padlock */
  #lockbox { transition:opacity 2s; }
  #lock { width:270px; margin:0 auto; position:relative; }
  #shackle { width:156px; height:104px; margin:0 auto -8px; position:relative; z-index:0; transform-origin:26px 100px;
             transition:transform 1s cubic-bezier(.3,1.5,.5,1); }
  #shackle svg { width:100%; height:100%; display:block; filter:drop-shadow(0 4px 5px #000); }
  #lock.open #shackle { transform:translateY(-28px) rotate(-24deg); }
  #lbody { position:relative; z-index:1; display:flex; justify-content:center; gap:10px; padding:18px 12px 30px;
           background:linear-gradient(165deg,#444 0%,#1b1b1b 38%,#101010 62%,#2c2c2c 100%);
           border:1px solid #6a6a6a; border-radius:14px;
           box-shadow:inset 0 1px 0 #888, inset 0 -8px 14px #000, 0 14px 30px #000; }
  #lbody::before, #lbody::after { content:""; position:absolute; top:8px; width:6px; height:6px; border-radius:50%;
           background:radial-gradient(circle at 35% 30%, #999, #333); box-shadow:0 1px 1px #000; }
  #lbody::before { left:9px; } #lbody::after { right:9px; }
  #kh { position:absolute; left:50%; bottom:9px; width:11px; height:11px; margin-left:-5px; border-radius:50%; background:#000; box-shadow:0 0 0 2px #3a3a3a; }
  #kh::after { content:""; position:absolute; left:4px; top:9px; width:3px; height:7px; background:#000; }
  #lock.shake { animation:shk .45s; } @keyframes shk { 20% { transform:translateX(-10px) rotate(-1.5deg); } 60% { transform:translateX(9px) rotate(1deg); } }
  .wh { display:flex; flex-direction:column; align-items:center; }
  .wh button { color:#8a8a8a; padding:5px 10px; font-size:.85rem; } .wh button:hover { color:#fff; }
  .wh div { width:42px; height:58px; line-height:58px; text-align:center; font-size:2rem; color:#e6dcc0; touch-action:none; cursor:ns-resize;
            user-select:none; background:linear-gradient(#000 0%,#1d1912 50%,#000 100%); border:1px solid #585858;
            box-shadow:inset 0 0 9px #000; text-shadow:0 0 8px rgba(230,220,190,.35); }
  #try { display:block; margin:1.3rem auto 0; text-decoration:underline; text-underline-offset:4px; }
  #notes { margin-top:1.6rem; text-align:center; letter-spacing:.7em; font-size:1.3rem; }
  #notes b { font-weight:normal; color:#333; } #notes b.on { color:#d8d0bc; text-shadow:0 0 10px #600; }

  /* something small, in the corner, that keeps looking */
  #eye { position:fixed; right:1.1rem; bottom:1.1rem; width:60px; height:60px; display:flex; align-items:center; justify-content:center;
         color:#bbb; opacity:.4; animation:look 3.4s ease-in-out infinite; z-index:2; filter:drop-shadow(0 0 6px rgba(200,0,0,.55)); }
  #eye svg { width:44px; height:44px; }
  #eye .pupil { animation:glance 6s ease-in-out infinite; }
  @keyframes glance { 0%,100% { transform:translateX(0); } 35% { transform:translateX(-4px); } 70% { transform:translateX(4px); } }
  @keyframes look { 50% { opacity:1; } }

  #hint { min-height:1.7em; margin:1.6rem 0 0; transition:opacity 2s; }
  #after p { margin:0 0 1.2rem; opacity:0; transition:opacity 2.5s; } #after p.on { opacity:1; }
  #go { color:var(--fg); text-underline-offset:4px; } #go:hover, #go:focus-visible { color:#fff; }

  /* the rooms (mini puzzles) */
  .ov { position:fixed; inset:0; background:#000; z-index:10; opacity:0; transition:opacity .6s; overflow-y:auto; }
  .ov.on { opacity:1; }
  .ov > div { max-width:34rem; margin:0 auto; padding:7vh 1.4rem; box-sizing:border-box; }
  #ret { color:var(--dim); text-decoration:underline; text-underline-offset:4px; display:inline-block; margin-bottom:1.6rem; }
  #dark { position:relative; height:min(56vh,440px); border:1px solid #1a1a1a; overflow:hidden; touch-action:none; }
  #glow { position:absolute; border-radius:50%; transform:translate(-50%,-50%); pointer-events:none;
          background:radial-gradient(circle, rgba(255,240,210,.16), rgba(255,240,210,0) 70%); }
  .it { position:absolute; opacity:0; color:#e8e0cc; pointer-events:none; user-select:none; }
  .it.lit { text-shadow:0 0 12px #a00; }
  #heart { display:flex; align-items:center; justify-content:center; width:150px; height:150px; margin:1.6rem auto;
           border-radius:50%; border:1px solid #2a2a2a; font-size:4rem; color:#3a0000; touch-action:manipulation; user-select:none; }
  #heart.p { animation:beat .35s; } @keyframes beat { 30% { transform:scale(1.16); color:#b00; border-color:#600; } }
  #st { text-align:center; min-height:1.7em; margin:0; }
  #again { display:block; margin:.8rem auto 0; color:var(--dim); text-decoration:underline; text-underline-offset:4px; }

  body.hit { animation:hit .6s steps(2,end); } @keyframes hit { 0%,100%{background:#000} 30%{background:#1a0000} }
  @media (prefers-reduced-motion:reduce) { .fade, #cur::before, #eye, #eye .pupil, #heart.p, body.hit, #lock.shake { animation:none; opacity:1; } }
  html { -webkit-tap-highlight-color:transparent; } body { touch-action:manipulation; }
</style>
</head>
<body>
<noscript><p style="color:#888;padding:2rem;font-family:serif">This needs JavaScript to run.</p></noscript>
<h1 class="fade">III</h1>
<p id="cap">Everything he had left is still in this room.</p>

<div id="line">
  <span>Ever since you </span><button id="cur" aria-label=""></button><span id="typed"></span><span id="rest">, the dream has only gotten longer.</span>
</div>
<input id="inp" type="text" autocomplete="off" autocapitalize="off" spellcheck="false" aria-label="your answer">

<div id="lockbox">
  <div id="lock"><div id="shackle"><svg viewBox="0 0 156 104" fill="none"><defs><linearGradient id="mt" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#bdbdbd"/><stop offset=".5" stop-color="#5c5c5c"/><stop offset="1" stop-color="#9a9a9a"/></linearGradient></defs><path d="M26 104 V54 a52 52 0 0 1 104 0 V104" stroke="url(#mt)" stroke-width="15" stroke-linecap="butt"/></svg></div><div id="lbody"><i id="kh"></i></div></div>
  <button id="try">open</button>
  <p id="lmsg" class="red" style="text-align:center"></p>
  <div id="notes" aria-label="what he found"><b>_</b><b>_</b><b>_</b><b>_</b></div>
</div>

<p id="hint" class="dim"></p>
<p id="back" class="red" role="status"></p>
<div id="after">
  <p id="a1"></p><p id="a2"></p><p>I'm still here.</p><p class="dim">- X</p>
  <p><a id="go" href="puzzle4.html">continue</a></p>
</div>

<button id="eye" aria-label=""><svg viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 24 C12 10 36 10 45 24 C36 38 12 38 3 24 Z"/><circle class="pupil" cx="24" cy="24" r="7" fill="currentColor" stroke="none"/></svg></button>

<div id="ov" class="ov" hidden><div>
  <button id="ret">return</button>
  <section id="m1" hidden><p class="dim">Hold the light on what he left.</p><div id="dark"><div id="glow"></div></div></section>
  <section id="m2" hidden>
    <button id="heart" aria-label="">&#9829;</button><p id="st"></p><button id="again">listen again</button>
  </section>
</div></div>

<script>
  const $ = id => document.getElementById(id);
  const CODE = ["1", "4", "0", "7"];                 // the padlock. Change it here.
  const calm = matchMedia("(prefers-reduced-motion: reduce)").matches;
  const bump = () => { try { localStorage.setItem("nl3", (+localStorage.getItem("nl3") || 0) + 1); } catch (e) {} };
  const hit = () => { document.body.classList.remove("hit"); void document.body.offsetWidth; document.body.classList.add("hit"); };
  const flash = (el, txt, ms = 2200) => { el.textContent = txt; setTimeout(() => { if (el.textContent === txt) el.textContent = ""; }, ms); };

  /* ---------- audio (generated) ---------- */
  let ac;
  addEventListener("pointerdown", () => {
    if (!ac) ac = new (window.AudioContext || window.webkitAudioContext)();
    if (ac.state === "suspended") ac.resume();
  });
  function tone(type, f0, f1, v, dur) {
    if (!ac) return; const n = ac.currentTime, o = ac.createOscillator(), g = ac.createGain();
    o.type = type; o.frequency.setValueAtTime(f0, n); o.frequency.exponentialRampToValueAtTime(f1, n + dur);
    g.gain.setValueAtTime(0, n); g.gain.linearRampToValueAtTime(v, n + .01); g.gain.exponentialRampToValueAtTime(.001, n + dur);
    o.connect(g); g.connect(ac.destination); o.start(n); o.stop(n + dur + .05);
  }
  const thump = () => { tone("sine", 60, 30, .8, .25); setTimeout(() => tone("sine", 48, 24, .5, .22), 190); };
  const click = () => tone("square", 1400, 300, .12, .08);

  /* ---------- state ---------- */
  const notes = [...document.querySelectorAll("#notes b")];
  const note = (i, c) => { notes[i].textContent = c; notes[i].classList.add("on"); };
  let unlocked = false, solved = false, mini = 0, done1 = false, done2 = false, seenEye = false, seenHeart = false;

  /* ---------- the rooms ---------- */
  const ov = $("ov"), timers = [];
  function openRoom(n) {
    mini = n; ov.hidden = false; $("m1").hidden = n !== 1; $("m2").hidden = n !== 2;
    requestAnimationFrame(() => ov.classList.add("on"));
    if (n === 2) { if (done2) $("st").textContent = "He remembered."; else play(); }
  }
  function closeRoom() {
    timers.forEach(clearTimeout); timers.length = 0; listening = false;
    ov.classList.remove("on"); setTimeout(() => { ov.hidden = true; }, 600); mini = 0;
  }
  $("ret").addEventListener("click", closeRoom);
  $("eye").addEventListener("click", () => { if (!unlocked) { seenEye = true; openRoom(1); } });
  $("cur").addEventListener("click", e => {
    e.stopPropagation();
    if (unlocked) inp.focus(); else { seenHeart = true; openRoom(2); }
  });
  $("line").addEventListener("click", () => { if (unlocked) inp.focus(); else flash($("back"), "Not yet.", 1600); });

  /* ---------- room 1: the dark. One eye left, a weak and flickering light. ---------- */
  const dark = $("dark"), glow = $("glow"), items = [];
  let px = -999, py = -999, R = 80;
  function put(txt, x, y, size, real, idx) {
    const e = document.createElement("span"); e.className = "it"; e.textContent = txt;
    e.style.left = x + "%"; e.style.top = y + "%"; e.style.fontSize = size; dark.appendChild(e);
    items.push({ e, real, idx, hold: 0, found: false });
  }
  put(CODE[0], 6 + Math.random() * 30, 12 + Math.random() * 68, "2.4rem", true, 0);
  put(CODE[1], 56 + Math.random() * 30, 12 + Math.random() * 68, "2.4rem", true, 1);
  for (let i = 0; i < 18; i++) put("x~.-_0123456789"[Math.floor(Math.random() * 15)], Math.random() * 94, Math.random() * 90, ".85rem", false);
  const aim = e => { const r = dark.getBoundingClientRect(); px = e.clientX - r.left; py = e.clientY - r.top - (e.pointerType === "touch" ? 48 : 0); };
  dark.addEventListener("pointerdown", aim); dark.addEventListener("pointermove", aim);
  dark.addEventListener("pointerleave", () => px = -999);

  /* ---------- room 2: the heart. Listen, then repeat the rhythm. ---------- */
  const heart = $("heart"), st = $("st");
  const PAT = [0, 600, 1200, 2200, 2600], IV = [600, 600, 1000, 400];
  let listening = false, taps = [], idle;
  const pulse = () => { heart.classList.remove("p"); void heart.offsetWidth; heart.classList.add("p"); thump(); };
  function play() {
    timers.forEach(clearTimeout); timers.length = 0; listening = false; taps = []; st.textContent = "Listen.";
    PAT.forEach(t => timers.push(setTimeout(pulse, 900 + t)));
    timers.push(setTimeout(() => { listening = true; st.textContent = "Now you."; }, 900 + PAT[4] + 800));
  }
  heart.addEventListener("pointerdown", e => {
    e.preventDefault(); if (!listening || mini !== 2) return;
    pulse(); taps.push(performance.now()); clearTimeout(idle);
    if (taps.length === 5) judge(); else idle = setTimeout(() => { taps = []; st.textContent = "Again."; }, 4000);
  });
  $("again").addEventListener("click", () => { if (mini === 2 && !done2) play(); });
  function judge() {
    listening = false;
    const iv = taps.slice(1).map((t, i) => t - taps[i]);
    if (iv.every((v, i) => Math.abs(v - IV[i]) <= Math.max(170, IV[i] * .28))) {
      done2 = true; st.textContent = "He remembered."; note(2, CODE[2]); note(3, CODE[3]);
      setTimeout(() => { if (mini === 2) closeRoom(); }, 2400);
    } else { st.textContent = "No."; bump(); hit(); timers.push(setTimeout(play, 1800)); }
  }

  /* ---------- the padlock ---------- */
  const wheels = [0, 0, 0, 0], buzz = p => { try { navigator.vibrate && navigator.vibrate(p); } catch (e) {} };
  CODE.forEach((_, i) => {
    const w = document.createElement("div"); w.className = "wh";
    const up = document.createElement("button"), dn = document.createElement("button"), d = document.createElement("div");
    up.textContent = "\u25B2"; dn.textContent = "\u25BC"; d.textContent = "0";
    const set = k => {
      if (unlocked) return; wheels[i] = (wheels[i] + k + 10) % 10; d.textContent = wheels[i]; click(); buzz(8);
      if (!calm) d.animate([{ transform: `translateY(${-9 * k}px)`, opacity: .2 }, { transform: "none", opacity: 1 }], { duration: 130 });
    };
    up.onclick = () => set(1); dn.onclick = () => set(-1);
    let sy = null;                                        // swipe the numbers like a real wheel
    d.addEventListener("pointerdown", e => { sy = e.clientY; d.setPointerCapture(e.pointerId); });
    d.addEventListener("pointermove", e => { if (sy === null) return; if (Math.abs(e.clientY - sy) >= 18) { set(e.clientY < sy ? 1 : -1); sy = e.clientY; } });
    d.addEventListener("pointerup", () => sy = null); d.addEventListener("pointercancel", () => sy = null);
    w.append(up, d, dn); $("lbody").appendChild(w);
  });
  $("try").addEventListener("click", () => {
    if (unlocked) return;
    if (wheels.join("") === CODE.join("")) {
      unlocked = true; $("lock").classList.add("open"); click(); buzz([30, 40, 70]); setTimeout(() => tone("square", 600, 200, .15, .15), 300);
      $("lmsg").textContent = ""; $("hint").textContent = "";
      setTimeout(() => { $("lockbox").style.opacity = 0; $("eye").style.display = "none"; $("cap").style.opacity = 0; }, 2200);
      setTimeout(() => { $("lockbox").style.display = "none"; $("cap").textContent = "He waited for you to finish the sentence."; $("cap").style.opacity = 1; startFinal(); }, 4400);
    } else {
      bump(); hit(); buzz([60, 40, 60]); flash($("lmsg"), "No.", 1800);
      $("lock").classList.remove("shake"); void $("lock").offsetWidth; $("lock").classList.add("shake");
    }
  });

  /* ---------- the last room: the sentence. It cannot be typed. It can only be left. ---------- */
  const inp = $("inp"), typed = $("typed"), back = $("back"), hint = $("hint");
  let hidAt = 0, at4 = 0, tm;
  inp.addEventListener("input", () => { typed.textContent = inp.value; clearTimeout(tm); tm = setTimeout(check, 1400); });
  inp.addEventListener("keydown", e => { if (e.key === "Enter") { clearTimeout(tm); check(); } });
  function check() {
    const v = inp.value.trim().toLowerCase(); if (!v || solved) return;
    bump(); const l = /^left\b/.test(v);
    flash(back, l ? "Not like that." : "No.", 2600);
    if (l) hint.textContent = "Some sentences only finish when you aren't looking.";
    inp.value = ""; typed.textContent = "";
  }
  function leave() { if (unlocked && at4 && !solved && !hidAt) { hidAt = performance.now(); document.title = "..."; } }
  function returned() {
    document.title = "III"; if (!unlocked || solved || !hidAt) return;
    const away = (performance.now() - hidAt) / 1000; hidAt = 0;
    if (performance.now() - at4 < 6000) return;
    if (away >= 3) solve(Math.round(away)); else flash(back, "Longer.", 2500);
  }
  document.addEventListener("visibilitychange", () => document.hidden ? leave() : returned());
  addEventListener("blur", leave); addEventListener("focus", returned);

  function startFinal() {
    at4 = performance.now();
    setTimeout(() => { if (!solved) hint.textContent = "She never stayed."; }, 45000);
    setTimeout(() => { if (!solved) hint.textContent = "Some sentences only finish when you aren't looking."; }, 100000);
  }
  function solve(away) {
    solved = true; document.body.classList.add("solved"); inp.blur(); hint.textContent = ""; back.textContent = ""; typed.textContent = "";
    [..."left"].forEach((c, i) => setTimeout(() => typed.textContent += c, 700 + i * 450));
    setTimeout(() => $("rest").classList.add("on"), 3200);
    const n = ["nl1", "nl2", "nl3"].reduce((a, k) => a + (+localStorage.getItem(k) || 0), 0);
    $("a1").textContent = `You were gone ${away} second${away === 1 ? "" : "s"}. I counted.`;
    $("a2").textContent = n > 0 ? `You got it wrong ${n} time${n === 1 ? "" : "s"} in my dream. I counted those too.`
                                : "You never got it wrong. Not once. Why couldn't you do that for me?";
    [...document.querySelectorAll("#after p")].forEach((p, i) => setTimeout(() => p.classList.add("on"), 7000 + i * 3200));
  }

  /* ---------- quiet hints, only if she has not found the way in ---------- */
  setTimeout(() => { if (!seenEye && !unlocked) hint.textContent = "He is still looking at you."; }, 20000);
  setTimeout(() => { if (!seenHeart && !unlocked) hint.textContent = "Something in here is still beating."; }, 80000);

  /* ---------- loop: the flickering light ---------- */
  let last = performance.now(), t = 0;
  function frame(now) {
    const dt = Math.min(.05, (now - last) / 1000); last = now; t += dt;
    if (mini === 1) {
      R = calm ? 80 : 78 + Math.sin(t * 6) * 7 - (Math.random() < .03 ? 30 : 0);
      glow.style.display = px < 0 ? "none" : "block";
      glow.style.left = px + "px"; glow.style.top = py + "px"; glow.style.width = glow.style.height = R * 2 + "px";
      items.forEach(o => {
        const cx = o.e.offsetLeft + o.e.offsetWidth / 2, cy = o.e.offsetTop + o.e.offsetHeight / 2;
        let op = Math.max(0, 1 - Math.hypot(cx - px, cy - py) / R); op = Math.min(1, op * op * 1.3);
        if (o.found) op = .9;
        o.e.style.opacity = op;
        if (o.real && !o.found) {
          o.hold = op > .7 ? o.hold + dt : Math.max(0, o.hold - dt);
          if (o.hold > .4) {
            o.found = true; note(o.idx, CODE[o.idx]); o.e.classList.add("lit");
            if (!done1 && items.filter(i => i.real && i.found).length === 2) {
              done1 = true; setTimeout(() => { if (mini === 1) closeRoom(); }, 1800);
            }
          }
        }
      });
    }
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
</script>
</body>
</html>
