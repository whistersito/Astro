<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="theme-color" content="#000000"><link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%96%A4%3C/text%3E%3C/svg%3E"><title>VIII</title><style>
:root{--fg:#bdbdbd;--dim:#5e5e5e;--red:#9a3a3a;--gold:#f0d9a6}
html{-webkit-tap-highlight-color:transparent}html,body{margin:0;background:#000;color:var(--fg)}
body{font-family:"Courier New",Courier,monospace;font-size:15px;line-height:1.6;transition:opacity 2s;overflow-x:hidden;touch-action:manipulation}
button{all:unset;cursor:pointer}
#noise{position:fixed;inset:0;width:100%;height:100%;z-index:30;pointer-events:none;mix-blend-mode:overlay;image-rendering:pixelated;opacity:.1}
#vig{position:fixed;inset:0;z-index:29;pointer-events:none;background:radial-gradient(ellipse at center,transparent 40%,#000 105%);opacity:.55;transition:opacity .3s}
#wake{position:fixed;inset:0;z-index:60;background:#000;display:flex;align-items:center;justify-content:center;text-align:center;cursor:pointer;transition:opacity 2.5s;padding:1.4rem}
#wake .a{animation:bl 3s ease-in-out infinite}#wake .b{color:var(--dim);font-size:.85rem}@keyframes bl{50%{opacity:.3}}#wake.off{opacity:0;pointer-events:none}
.wrap{position:relative;z-index:2;max-width:760px;margin:0 auto;padding:2.5vh 1rem 12vh;box-sizing:border-box}
.hud{display:flex;justify-content:space-between;align-items:center;gap:.8rem;color:var(--dim);font-size:.85rem;border-bottom:1px solid #1a1a1a;padding-bottom:.4rem;margin-bottom:1rem}
.hbtn{border:1px solid #2a2a2a;padding:.1rem .7rem;color:var(--dim)}.hbtn:hover{color:#fff;border-color:#666}
.dim{color:var(--dim)}.err{color:var(--red)}.ok{color:var(--gold)}
.go{color:var(--fg);text-decoration:underline;text-underline-offset:4px;display:inline-block;margin-top:1rem;cursor:pointer}
#msg{min-height:1.7em;color:var(--red);text-align:center;margin:.6rem 0}#cap{min-height:3.4em;color:var(--dim);font-style:italic;text-align:center;margin:.4rem 0}
#frag,#memp{position:fixed;inset:0;z-index:45;background:rgba(0,0,0,.95);display:flex;align-items:center;justify-content:center;padding:1.4rem;box-sizing:border-box;overflow-y:auto}
#frag[hidden],#memp[hidden]{display:none}.card{max-width:32rem;width:100%}.card p{margin:.7rem 0}
body.hit{animation:hit .5s steps(2,end)}@keyframes hit{0%,100%{background:#000}30%{background:#1a0000}}
.voice{position:fixed;z-index:28;pointer-events:none;opacity:0;color:#555}
.wheels{display:flex;justify-content:center;gap:.6rem;margin:1rem 0}.wheels button{width:48px;height:64px;line-height:64px;text-align:center;font-size:2rem;background:#000;border:1px solid #555;color:#e6dcc0;user-select:none}
@media (prefers-reduced-motion:reduce){body.hit{animation:none}}

#lt{position:fixed;inset:0;z-index:25;background:#cfd8ff;opacity:0;pointer-events:none;transition:opacity .08s}
#rainov{position:fixed;inset:0;z-index:1;pointer-events:none;opacity:.22;background:repeating-linear-gradient(105deg,transparent 0 6px,rgba(180,190,210,.2) 6px 7px);background-size:200px 200px;animation:rain .35s linear infinite}
@keyframes rain{to{background-position:-40px 200px}}
#radio{border:1px solid #1d1d1d;padding:1.2rem;margin-top:.6rem}
#freq{font-size:3.4rem;color:#fff;text-align:center;text-shadow:0 0 14px rgba(255,255,255,.25)}#sig{text-align:center;min-height:1.6em}
#dialwrap{position:relative;margin:1.6rem 0 .4rem}
#ticks{position:absolute;left:11px;right:11px;top:-16px;height:10px;pointer-events:none}#ticks i{position:absolute;top:0;width:1px;height:10px;background:#666}
#dial{-webkit-appearance:none;appearance:none;width:100%;height:36px;background:transparent;margin:0}
#dial::-webkit-slider-runnable-track{height:2px;background:#333}#dial::-webkit-slider-thumb{-webkit-appearance:none;width:22px;height:34px;background:#cfcfcf;border-radius:3px;margin-top:-16px}
#dial::-moz-range-track{height:2px;background:#333}#dial::-moz-range-thumb{width:22px;height:34px;background:#cfcfcf;border:0;border-radius:3px}
#holdb{height:3px;background:#7a2a2a;width:0;margin-top:.4rem}#fine{display:flex;justify-content:center;gap:1rem;margin-top:.8rem}#fine button{border:1px solid #2a2a2a;padding:.3rem 1rem;color:var(--dim)}
#door{margin-top:1.4rem;text-align:center;border-top:1px solid #1d1d1d;padding-top:1rem}#door[hidden]{display:none}
</style></head><body><noscript><p style="padding:2rem">This needs JavaScript to run.</p></noscript>
<canvas id="noise" width="96" height="96"></canvas><div id="vig"></div>
<div id="wake"><div><p class="a">tap to begin</p><p class="b">headphones. this one has sound.</p></div></div>
<div id="frag" hidden><div class="card" id="fc"></div></div><div id="memp" hidden><div class="card" id="mc"></div></div>

<div id="lt"></div><div id="rainov"></div>
<main class="wrap">
  <div class="hud"><span>VIII &middot; THE STORM IS COMING</span><span id="fc2">0 / 3</span><button id="memb" class="hbtn">memories</button></div>
  <p id="cap">Something has been humming in the basement since the storm warning. The radio is the only thing that still reaches it.</p>
  <div id="radio"><div id="freq">87.5</div><div id="sig" class="dim">static</div>
    <div id="dialwrap"><div id="ticks"></div><input id="dial" type="range" min="875" max="1080" step="1" value="875" aria-label="tuner"></div>
    <div id="holdb"></div><div id="fine"><button id="dn">&minus; 0.1</button><button id="up">+ 0.1</button></div></div>
  <div id="door" hidden><p>the basement door. three digits.<br><span class="dim">lowest station first.</span></p><div class="wheels" id="wh"></div><span class="go" id="try">open</span></div>
  <p id="msg" role="status"></p>
</main>

<script>
const $=id=>document.getElementById(id);
const get=k=>{try{return +localStorage.getItem(k)||0}catch(e){return 0}};
const bump=k=>{try{localStorage.setItem(k,get(k)+1)}catch(e){}};
const calm=matchMedia("(prefers-reduced-motion: reduce)").matches;
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
const rnd=a=>a[Math.floor(Math.random()*a.length)];
let ac,booted=false,stat=0,last=performance.now();
function tone(type,f0,f1,v,dur){if(!ac)return;const n=ac.currentTime,o=ac.createOscillator(),g=ac.createGain();o.type=type;o.frequency.setValueAtTime(f0,n);o.frequency.exponentialRampToValueAtTime(Math.max(1,f1),n+dur);g.gain.setValueAtTime(0,n);g.gain.linearRampToValueAtTime(v,n+.005);g.gain.exponentialRampToValueAtTime(.001,n+dur);o.connect(g);g.connect(ac.destination);o.start(n);o.stop(n+dur+.05)}
function glitch(v=.5,dur=.25){if(!ac)return;v=Math.min(v,.6);const n=ac.currentTime,len=Math.floor(ac.sampleRate*dur),buf=ac.createBuffer(1,len,ac.sampleRate),d=buf.getChannelData(0);for(let i=0;i<len;i++){d[i]=(Math.random()*2-1)*(1-i/len);if(i%37<6)d[i]*=3}const src=ac.createBufferSource();src.buffer=buf;const ws=ac.createWaveShaper(),c=new Float32Array(256);for(let i=0;i<256;i++)c[i]=Math.tanh((i/128-1)*6);ws.curve=c;const f=ac.createBiquadFilter();f.type="bandpass";f.frequency.value=700+Math.random()*2400;f.Q.value=.9;const g=ac.createGain();g.gain.value=v*.5;src.connect(f);f.connect(ws);ws.connect(g);g.connect(ac.destination);src.start(n);tone("sawtooth",140+Math.random()*80,40,v*.16,dur)}
const jolt=()=>{glitch(.7,.28);try{navigator.vibrate&&navigator.vibrate([40,30,40])}catch(e){}document.body.classList.remove("hit");void document.body.offsetWidth;document.body.classList.add("hit")};
const say=(t,ms=2600)=>{$("msg").textContent=t;setTimeout(()=>{if($("msg").textContent===t)$("msg").textContent=""},ms)};
const cap=t=>{$("cap").textContent=t};
const nctx=$("noise").getContext("2d"),img=nctx.createImageData(96,96);
setInterval(()=>{for(let i=0;i<img.data.length;i+=4){const v=Math.random()*255;img.data[i]=img.data[i+1]=img.data[i+2]=v;img.data[i+3]=255}nctx.putImageData(img,0,0);stat=Math.max(0,stat-.02);$("noise").style.opacity=.05+stat*.5},90);
function mkBuf(brown){const len=ac.sampleRate*3,b=ac.createBuffer(1,len,ac.sampleRate),d=b.getChannelData(0);let l=0;for(let i=0;i<len;i++){const w=Math.random()*2-1;if(brown){l=(l+.02*w)/1.02;d[i]=l*3.5}else d[i]=w}return b}
function loop(buf,type,f,q,g){const s=ac.createBufferSource();s.buffer=buf;s.loop=true;const fl=ac.createBiquadFilter();fl.type=type;fl.frequency.value=f;fl.Q.value=q;const gn=ac.createGain();gn.gain.value=g;s.connect(fl);fl.connect(gn);gn.connect(ac.destination);s.start();return gn}
function whisper(t){if(calm)return;const e=document.createElement("span");e.className="voice";e.textContent=t;e.style.left=Math.random()*70+"%";e.style.top=Math.random()*85+"%";e.style.fontSize=(1+Math.random()*1.5)+"rem";document.body.appendChild(e);glitch(.1,.12);e.animate([{opacity:0},{opacity:.6},{opacity:0}],{duration:1400}).onfinish=()=>e.remove()}
const MEM=()=>{try{return JSON.parse(localStorage.getItem("nlmem")||"[]")}catch(e){return[]}};
function addMem(id,t){const m=MEM();if(m.find(x=>x.id===id))return;m.push({id,t});try{localStorage.setItem("nlmem",JSON.stringify(m))}catch(e){}}
$("memb").onclick=()=>{if(!booted)return;const m=MEM();$("mc").innerHTML='<div class="dim">MEMORIES</div>'+(m.length?m.map(x=>"<p>"+x.t+"</p>").join(""):'<p class="dim">nothing yet.</p>')+'<span class="go" id="memx">close</span>';$("memp").hidden=false;$("memx").onclick=()=>{$("memp").hidden=true}};
async function showFrag(title,lines,after){const f=$("frag"),c=$("fc");c.innerHTML='<div class="dim">'+title+"</div>";f.hidden=false;for(const l of lines){const p=document.createElement("p");p.textContent=l;p.style.opacity=0;p.style.transition="opacity 1.6s";c.appendChild(p);void p.offsetWidth;p.style.opacity=1;tone("sine",196,196,.04,1.4);await sleep(calm?500:2300)}const b=document.createElement("span");b.className="go";b.textContent="continue";b.onclick=()=>{f.hidden=true;after&&after()};c.appendChild(b)}
const leave=u=>{document.body.style.opacity=0;setTimeout(()=>location.href=u,2100)};
function wheels(el,n){const d=Array(n).fill(0);d.forEach((_,i)=>{const b=document.createElement("button");b.textContent="0";b.onclick=()=>{d[i]=(d[i]+1)%10;b.textContent=d[i];tone("square",1200,700,.02,.03)};el.appendChild(b)});return d}
function boot(){if(booted)return;booted=true;ac=new(window.AudioContext||window.webkitAudioContext)();ac.resume();$("wake").classList.add("off");start()}
$("wake").addEventListener("click",boot);
document.body.style.opacity=0;setTimeout(()=>document.body.style.opacity=1,50);

const ST=[{f:917,d:4,l:["Sequence 4.","She asked who had called. I said nobody.","I had unplugged the phone that morning.","First, her friends. I told her they only loved who she used to be."]},
 {f:983,d:7,l:["Sequence 7.","She wanted to see a doctor. I told her doctors lie to tired people.","She cancelled. I made tea and called it care.","Second, the doctor."]},
 {f:1049,d:9,l:["Sequence 9.","I kept a list of everything I had given away.","I read it to her whenever she reached for the door.","Two cuts are still missing. The stairs will tell you."]}];
const DEC=[891,955,1011,1066],CODE=ST.map(s=>s.d).join("");
const dial=$("dial");let found=[],hold=0,lockT=0,tGame=0,beatT=0,sG,wG,hG,rG,wh;
function thunder(){const len=ac.sampleRate*2.2,b=ac.createBuffer(1,len,ac.sampleRate),d=b.getChannelData(0);let l=0;for(let i=0;i<len;i++){l=(l+.03*(Math.random()*2-1))/1.03;d[i]=l*4*(1-i/len)}const s=ac.createBufferSource();s.buffer=b;const f=ac.createBiquadFilter();f.type="lowpass";f.frequency.value=220;const g=ac.createGain();g.gain.value=.7;s.connect(f);f.connect(g);g.connect(ac.destination);s.start()}
function flash(){const l=$("lt");l.style.opacity=.85;setTimeout(()=>l.style.opacity=0,110);setTimeout(()=>{l.style.opacity=.4;setTimeout(()=>l.style.opacity=0,80)},230);setTimeout(thunder,600+Math.random()*1800)}
function storm(){setTimeout(()=>{flash();storm()},Math.max(5000,16000-tGame*60)+Math.random()*5000)}
function start(){
  const W=mkBuf(false),B=mkBuf(true);
  sG=loop(W,"bandpass",2200,.4,.2);wG=loop(W,"bandpass",3300,7,0);rG=loop(W,"highpass",1800,.4,.03);loop(B,"lowpass",260,.5,.12);
  const o=ac.createOscillator(),g=ac.createGain();o.type="sine";o.frequency.value=62;g.gain.value=0;o.connect(g);g.connect(ac.destination);o.start();hG=g;
  storm();setTimeout(()=>{if(found.length<1)cap("The quiet stations are true. The ones that whisper are lying.")},60000);
  setTimeout(()=>{if(found.length<3){cap("Worn marks on the dial: the true stations.");ST.forEach(s=>{const k=document.createElement("i");k.style.left=((s.f-875)/205*100)+"%";$("ticks").appendChild(k)})}},130000);
  requestAnimationFrame(frame);
}
$("dn").onclick=()=>{dial.value=+dial.value-1};$("up").onclick=()=>{dial.value=+dial.value+1};
function capture(s){hold=0;found.push(s.f);addMem("s"+s.d,s.l.slice(1).join(" "));$("fc2").textContent=found.length+" / 3";tone("sine",523,523,.08,1.6);showFrag("SIGNAL "+(s.f/10).toFixed(1),s.l,()=>{if(found.length===3)openDoor()})}
function trap(){hold=0;lockT=6;bump("nl8");jolt();stat=1;whisper(rnd(["the doctors lied to you","they never called","only I stay"]));say("It pulled you in.")}
function openDoor(){$("door").hidden=false;cap("Three digits, one for each memory. Lowest station first.");wh=wheels($("wh"),3)}
$("try").onclick=()=>{if(wh.join("")===CODE){tone("sawtooth",90,55,.2,1.6);say("The door opens.");$("try").style.display="none";localStorage.setItem("nlp8","1");setTimeout(()=>leave("puzzle9.html"),1800)}else{bump("nl8");jolt();say("The lock does not move.")}};
function frame(now){
  const dt=Math.min(.05,(now-last)/1000);last=now;tGame+=dt;const f=+dial.value;
  let dT=1e9,tt=null;ST.forEach(s=>{if(!found.includes(s.f)){const d=Math.abs(f-s.f);if(d<dT){dT=d;tt=s}}});
  let dD=1e9;DEC.forEach(x=>dD=Math.min(dD,Math.abs(f-x)));
  const cT=Math.max(0,1-dT/8),cD=Math.max(0,1-dD/8),c=Math.max(cT,cD),t=ac.currentTime;
  sG.gain.setTargetAtTime(.22*(1-.93*c),t,.05);wG.gain.setTargetAtTime(lockT>0?0:.2*cD*cD,t,.05);hG.gain.setTargetAtTime(.22*cT*cT,t,.05);rG.gain.setTargetAtTime(.03+Math.min(.06,tGame/600),t,1);
  $("freq").textContent=(f/10).toFixed(1);$("sig").textContent=lockT>0?"...":(c<.3?"static":(cD>cT?"whispering":"breathing"));
  if(!$("frag").hidden||!$("memp").hidden){}
  else if(lockT>0)lockT-=dt;
  else if(dT<=3&&tt){hold+=dt;if(hold>2.5)capture(tt)}
  else if(dD<=3){hold+=dt;if(hold>1.5)trap()}
  else hold=Math.max(0,hold-dt*2);
  if(cT>.6){beatT+=dt;if(beatT>1.05){beatT=0;tone("sine",58,30,.18*cT,.25)}}
  $("holdb").style.width=Math.min(100,hold/2.5*100)+"%";
  requestAnimationFrame(frame);
}
</script>
<script>
/* DEV SKIP (delete this whole block before sharing if you want): on a PC keyboard, type the code outside any text field to jump to the next page. */
(() => {
  if (!matchMedia("(hover: hover) and (pointer: fine)").matches) return;           // phones and tablets: never
  const NEXT = { "index.html": "puzzle2.html", "puzzle2.html": "puzzle3.html", "puzzle3.html": "puzzle4.html",
                 "puzzle4.html": "puzzle5.html", "puzzle5.html": "puzzle6.html", "puzzle6.html": "puzzle7.html",
                 "puzzle7.html": "puzzle8.html", "puzzle8.html": "puzzle9.html", "puzzle9.html": "puzzle10.html" };   // add "puzzle10.html": "puzzle11.html" when it exists
  const CODE = atob("Z2FiYnk="); let buf = "";
  addEventListener("keydown", e => {
    if (!e.isTrusted || e.ctrlKey || e.metaKey || e.altKey || e.key.length !== 1) return;
    if (/^(INPUT|TEXTAREA)$/.test((e.target || {}).tagName)) return;               // typing a name or a command never triggers it
    buf = (buf + e.key.toLowerCase()).slice(-CODE.length);
    if (buf !== CODE) return; buf = "";
    const nxt = NEXT[location.pathname.split("/").pop() || "index.html"]; if (!nxt) return;
    try { localStorage.setItem("nlcarry", "1"); if (!localStorage.getItem("nlstart")) localStorage.setItem("nlstart", Date.now()); if (!localStorage.getItem("nlname")) localStorage.setItem("nlname", "you"); } catch (x) {}
    document.body.style.transition = "opacity .4s"; document.body.style.opacity = 0; setTimeout(() => location.href = nxt, 400);
  });
})();
</script>
</body></html>
