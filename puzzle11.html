<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>puzzle11</title>
  <style>
    :root {
      --bg-1: #0d1722;
      --bg-2: #1c2d3d;
      --bg-3: #2b3944;
    }

    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: var(--bg-1);
    }

    body {
      display: block;
      background:
        radial-gradient(circle at 50% 20%, rgba(72, 90, 108, 0.75), rgba(9, 13, 18, 0.2) 35%, rgba(7, 10, 15, 0.92) 100%),
        linear-gradient(to bottom, var(--bg-2), var(--bg-1));
    }

    .art {
      position: fixed;
      inset: 0;
      background-image: url("puzzle11-reference.jpg");
      background-size: cover;
      background-position: center center;
      background-repeat: no-repeat;
      filter: saturate(0.8) contrast(1.12) brightness(0.82);
      transform: scale(1.02);
    }

    .art::before {
      content: "";
      position: absolute;
      inset: 0;
      background:
        linear-gradient(to bottom, rgba(0,0,0,0.12), rgba(0,0,0,0.28)),
        radial-gradient(circle at 50% 50%, rgba(255,255,255,0.06), transparent 60%);
      pointer-events: none;
    }

    .fallback {
      position: fixed;
      inset: 0;
      background:
        linear-gradient(to bottom, rgba(15,23,31,0.35) 0%, rgba(10,14,18,0.6) 100%),
        radial-gradient(circle at 50% 55%, rgba(255,255,255,0.12), rgba(255,255,255,0) 35%),
        linear-gradient(180deg, #0c1720 0%, #243743 42%, #0b1117 100%);
      opacity: 0;
      pointer-events: none;
    }

    .art:not([style*="background-image"]) {
      opacity: 0;
    }

    .fallback.visible {
      opacity: 1;
    }
  </style>
</head>
<body>
  <div class="art" aria-label="Final eerie figure in field scene" role="img"></div>
  <div class="fallback visible" aria-hidden="true"></div>

  <script>
    const art = document.querySelector('.art');
    const fallback = document.querySelector('.fallback');

    const img = new Image();
    img.onload = () => {
      art.style.backgroundImage = 'url("puzzle11-reference.jpg")';
      fallback.classList.remove('visible');
    };
    img.onerror = () => {
      fallback.classList.add('visible');
    };
    img.src = 'puzzle11-reference.jpg';
  </script>
</body>
</html>
