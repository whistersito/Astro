<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>puzzle11</title>
  <style>
    :root {
      --bg-1: #070d12;
      --bg-2: #121c27;
    }

    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: var(--bg-1);
    }

    body {
      position: relative;
      background: radial-gradient(circle at 50% 18%, rgba(55, 75, 90, 0.6), rgba(7, 13, 18, 0.1) 35%, rgba(7, 13, 18, 0.9) 100%);
    }

    #bg {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      background: linear-gradient(to bottom, var(--bg-2), var(--bg-1));
      filter: saturate(0.8) contrast(1.08) brightness(0.72);
    }

    #bg::before {
      content: "";
      position: absolute;
      inset: 0;
      background: linear-gradient(to bottom, rgba(0,0,0,0.15), rgba(0,0,0,0.28));
      pointer-events: none;
    }
  </style>
</head>
<body>
  <video id="bg" autoplay muted loop playsinline>
    <source src="videoplayback.mp4" type="video/mp4" />
  </video>
</body>
</html>
